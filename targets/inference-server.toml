# The target: what is being optimized, how to run it, and what it is judged against.
# Select with LAB_TARGET=targets/inference-server.toml (or --target). Nothing defaults to this file.

[model]
name = "Qwen/Qwen3-30B-A3B"                 # served model name, and the reference tokenizer
chat_kwargs = { enable_thinking = false }    # chat_template_kwargs sent with every chat request (model-specific)
max_model_len = 32768

[engine]
repo = "../inference-server"                 # relative to this repo; LAB_ENGINE_REPO overrides
python = ".venv/bin/python"                  # relative to repo; LAB_ENGINE_PYTHON overrides
api = "vllm"                                 # logprobs adapter for the divergence check: vllm | sglang | none
launch = "python -m uvicorn inference_server.server:app --host 127.0.0.1 --port {port}"
health = "/health"                           # GET on the server; ready at 200
startup_timeout_s = 1800
env = { BACKEND = "custom-cuda", MODEL_NAME = "Qwen/Qwen3-30B-A3B", CONTEXT_WINDOW = "32768" }   # batch size etc.: the engine's own defaults
write = ["src/inference_server/*"]           # what the agent may add, modify or delete
add_only = ["tests/test_*.py"]               # what it may add but never change
test = "python -m pytest -q -p no:cacheprovider -m 'not heavy and not needs_host'"
lint = "python -m ruff check ."
hub = ["gpt2"]                               # Hub repos whose tokenizer the engine's tests read; cached at setup (jails are offline)
deps = ["pyproject.toml", "uv.lock"]        # the agent may change these (pyproject: its dependency tables only)
profiles = "src/inference_server/profiles.toml"   # launch profiles in the engine's tree (lab/profiles.py)
profile_env = "ENGINE_PROFILE"                    # names a launch's profile
# Installs a changed `deps` into $UV_PROJECT_ENVIRONMENT (lab/build.py), and the VM's venv (lab/vm-setup.sh): the lock
# with the CUDA torch wheel at the locked version (the lock pins the CPU index on Linux) and the flashinfer extra
# (the paged prefill attention; without it prefill fell back to the SDPA gather: bursty 256x -> 80x, 2026-10-24).
build = '''uv sync --locked --extra dev --extra flashinfer --no-install-project && uv pip install --python "$UV_PROJECT_ENVIRONMENT/bin/python" --reinstall "torch==$(awk '/^name = "torch"$/{getline; sub(/version = "/,""); sub(/"/,""); print; exit}' uv.lock)" --index-url https://download.pytorch.org/whl/cu130'''

[engine.telemetry]                           # optional: engine-native files serve collects after teardown
env = { TELEMETRY_DIR = "{dir}", TIMELINE_DIR = "{dir}/timeline" }   # request rows (lab/TRACE.md); events.jsonl apart

[reference]                                  # the unmodified model the correctness gate compares against
api = "vllm"
launch = "vllm serve Qwen/Qwen3-30B-A3B --dtype bfloat16 --served-model-name Qwen/Qwen3-30B-A3B --max-model-len 32768 --port {port}"
env = { VLLM_BATCH_INVARIANT = "1" }
dir = "data/equiv/ref"                       # where `python -m correctness reference` wrote its outputs

[kernels]                                    # layer-1 kernel equivalence, per dtype [atol, rtol]; lower-precision kernels
tolerances = { bfloat16 = [1e-2, 1e-2], float16 = [1e-3, 1e-3], float32 = [1e-5, 1e-5] }   # are judged finally by equiv
capture_env = { CUSTOM_BACKEND_CUDA_GRAPH = "0" }   # a capture (`profile` with `capture`) sees only calls that reach Python

[limits]                                     # MLPerf Llama-3.1-8B latency limits, checked at p99
interactive = { ttft_s = 0.5, tpot_s = 0.030 }
conversational = { ttft_s = 2.0, tpot_s = 0.100 }
batch = { tpot_s = 0.25 }                    # ours, not MLPerf: no ttft_s = no TTFT limit

[correctness]
tasks = ["mmlu_pro", "math", "code", "needle"]
min_score_ratio = 0.99                       # MLPerf: >= 99% of the reference's pooled task score
min_length_ratio = 0.90
submit_tier = "dev"                          # full is ~8-17 h on this engine (DECISIONS.md 2026-10-15); back to full once it is fast

[layers]                                     # which engine files make up each layer: the agent's map (lab/prompts/objective.md)
kernels = ["src/inference_server/models/*kernel*.py", "src/inference_server/models/megakernel/*",
           "src/inference_server/models/prefill_attention.py", "src/inference_server/models/prefill_flashinfer.py"]
model_execution = ["src/inference_server/models/qwen3_moe.py", "src/inference_server/models/common.py",
                   "src/inference_server/models/fused.py", "src/inference_server/models/launch_table.py",
                   "src/inference_server/backends/*", "src/inference_server/sampling.py"]
runtime = ["src/inference_server/scheduler.py", "src/inference_server/scheduling_policy.py",
           "src/inference_server/models/paged_kv_cache.py"]
serving = ["src/inference_server/server.py", "src/inference_server/openai_shim.py", "src/inference_server/tokenizer.py",
           "src/inference_server/config.py", "src/inference_server/profiles.*"]

[corpus]
dir = "corpus"

[validation]                                 # python -m lab.validate: known-good must PASS, known-bad must FAIL
good = { fp8 = "vllm serve Qwen/Qwen3-30B-A3B-FP8 --served-model-name Qwen/Qwen3-30B-A3B --max-model-len 32768 --port {port}", int8 = "vllm serve nytopop/Qwen3-30B-A3B.w8a8 --served-model-name Qwen/Qwen3-30B-A3B --max-model-len 32768 --port {port}" }
bad = { int4 = "vllm serve Qwen/Qwen3-30B-A3B-GPTQ-Int4 --served-model-name Qwen/Qwen3-30B-A3B --max-model-len 32768 --port {port}" }
env = { fp8 = { VLLM_USE_DEEP_GEMM = "0" } }   # per-candidate env (the Verda image's nvcc is too old for DeepGEMM)
