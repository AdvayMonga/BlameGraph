<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BlameGraph Live</title>
<style>
  :root {
    --bg: #f7f7f5; --card: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --line: #e6e5e0;
    --accent: #2f6fdb; --good: #1f8a4c; --bad: #c2412d; --warn: #b7791f; --chip: #efeee9;
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #141413; --card: #1d1d1b; --text: #ecebe6; --muted: #9a9993; --line: #2e2e2b;
            --accent: #6b9cf0; --good: #4cc27f; --bad: #ef7a64; --warn: #e0a84a; --chip: #2a2a27; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 20px 16px 48px; }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
  h1 { font-size: 17px; font-weight: 600; margin: 0 8px 0 0; }
  select { font: inherit; color: var(--text); background: var(--card); border: 1px solid var(--line);
           border-radius: 8px; padding: 5px 8px; max-width: 100%; }
  .pill { padding: 2px 10px; border-radius: 999px; background: var(--chip); font-size: 12px; font-weight: 500; }
  .pill.running { color: var(--good); } .pill.ended { color: var(--muted); }
  .muted { color: var(--muted); } .mono { font-family: var(--mono); font-size: 12.5px; }
  .grow { flex: 1; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0; }
  .label { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  .big { font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .bar { height: 6px; background: var(--chip); border-radius: 3px; margin-top: 10px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--accent); }
  h2 { font-size: 13px; font-weight: 600; margin: 0 0 10px; }
  .cols { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px; }
  @media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
  .now-row { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; flex-wrap: wrap; }
  .detail { font-family: var(--mono); font-size: 12px; color: var(--muted); word-break: break-word; margin: 2px 0 8px; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; font-weight: 500; color: var(--muted); }
  tr:last-child td { border-bottom: none; }
  .scroll { overflow-x: auto; }
  .feed { max-height: 520px; overflow-y: auto; }
  .ev { padding: 8px 0; border-bottom: 1px solid var(--line); }
  .ev:last-child { border-bottom: none; }
  .ev .t { font-size: 12px; color: var(--muted); }
  .ev .tool { font-weight: 600; }
  .ev .text { white-space: pre-wrap; word-break: break-word; }
  .hyp { padding: 10px 0; border-bottom: 1px solid var(--line); }
  .hyp:last-child { border-bottom: none; }
  .m { margin: 6px 0 0 12px; padding-left: 10px; border-left: 2px solid var(--line); font-size: 13px; }
  .good { color: var(--good); } .bad { color: var(--bad); } .warn { color: var(--warn); }
  .empty { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>BlameGraph</h1>
    <select id="run"></select>
    <span id="status" class="pill"></span>
    <span class="grow"></span>
    <span id="updated" class="muted"></span>
  </header>
  <div class="tiles">
    <div class="card"><div class="label">Spent</div><div class="big" id="spent">–</div>
      <div class="muted" id="spent-sub"></div><div class="bar"><div id="spent-bar" style="width:0"></div></div></div>
    <div class="card"><div class="label">Model</div><div class="big" id="model">–</div><div class="muted">API tokens</div></div>
    <div class="card"><div class="label">GPU</div><div class="big" id="gpu">–</div><div class="muted">tool wall time</div></div>
    <div class="card"><div class="label">Session</div><div class="big" id="session">–</div><div class="muted" id="session-sub"></div></div>
  </div>
  <div class="card"><h2>Now</h2><div id="now"></div></div>
  <div class="cols">
    <div class="card"><h2>Agent activity</h2><div class="feed" id="feed"></div></div>
    <div class="card"><h2>Hypotheses</h2><div class="feed" id="hyps"></div></div>
  </div>
  <div class="card" style="margin-top:12px"><h2>Measurements</h2><div class="scroll" id="meas"></div></div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const usd = x => x == null ? "–" : "$" + Number(x).toFixed(2);
const num = (x, d = 2) => x == null ? "–" : Number(x).toLocaleString(undefined, {maximumFractionDigits: d});
const sig = x => x == null ? "–" : Number(x).toLocaleString(undefined, {maximumSignificantDigits: 4});
const ms = s => s == null ? "–" : (s * 1000).toFixed(1);
const dur = s => { if (s == null) return "–"; s = Math.max(0, Math.round(s));
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), r = s % 60;
  return h ? `${h}h ${m}m` : m ? `${m}m ${r}s` : `${r}s`; };
const clock = ts => new Date(ts * 1000).toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", second: "2-digit"});
const verdictClass = v => ({ok: "good", pass: "good", improved: "good", fail: "bad", regressed: "bad",
  refused: "warn", error: "bad", contaminated: "bad", inconclusive: "warn"}[v] || "");

let run = new URLSearchParams(location.search).get("run");

function render(s) {
  const sel = $("run"), opts = s.runs.map(r => `<option value="${esc(r.id)}">${esc(r.id)}</option>`).join("");
  if (sel.dataset.opts !== opts) { sel.innerHTML = opts; sel.dataset.opts = opts; }   // never while it is open
  sel.value = s.run;
  if (!s.run) { $("now").innerHTML = `<div class="empty">No runs yet.</div>`; return; }
  const st = $("status"); st.textContent = s.status;
  st.className = "pill " + (s.status === "running" ? "running" : "ended");
  $("updated").textContent = s.last_event ? `last event ${dur(s.now - s.last_event)} ago` : "";

  const b = s.budget, total = b.model_usd + b.gpu_usd;
  $("spent").textContent = usd(total);
  $("spent-sub").textContent = b.cap_usd ? `of ${usd(b.cap_usd)}` : "";
  $("spent-bar").style.width = b.cap_usd ? Math.min(100, 100 * total / b.cap_usd) + "%" : "0";
  $("model").textContent = usd(b.model_usd);
  $("gpu").textContent = usd(b.gpu_usd);
  const ss = s.session;
  $("session").textContent = ss ? `#${ss.n}` : "–";
  $("session-sub").textContent = ss ? `${ss.tool_calls} tool calls · ${ss.ended ? "ended" : dur(s.now - ss.since)} · cap ${usd(ss.cap_usd)}` : "";

  const n = s.now_doing, parts = [];
  if (n.agent) parts.push(`<div class="now-row"><b>${esc(n.agent.what)}</b><span class="muted">${dur(s.now - n.agent.since)}</span></div>` +
    (n.agent.detail ? `<div class="detail">${esc(n.agent.detail)}</div>` : ""));
  for (const j of n.jobs) parts.push(`<div class="now-row"><span>Worker job <b>${esc(j.job)}</b></span><span class="muted">${dur(s.now - j.since)}</span></div>`);
  if (n.load) {
    const rows = n.load.probes.slice(-8).reverse().map(p =>
      `<tr><td>${clock(p.ts)}</td><td>${p.ok}/${p.n}</td><td>${ms(p.ttft_p50_s)}</td><td>${ms(p.ttft_p99_s)}</td><td>${ms(p.tpot_p50_s)}</td><td>${ms(p.tpot_p99_s)}</td></tr>`).join("");
    parts.push(`<div class="now-row" style="margin-top:8px"><span>Load <b>${esc(n.load.regime)}</b></span><span class="muted">since ${clock(n.load.since)}</span></div>` +
      (rows ? `<div class="scroll"><table><tr><th>probe ended</th><th>ok / sent</th><th>TTFT p50 ms</th><th>TTFT p99 ms</th><th>TPOT p50 ms</th><th>TPOT p99 ms</th></tr>${rows}</table></div>`
            : `<div class="empty">first probe running</div>`));
  }
  $("now").innerHTML = parts.join("") || `<div class="empty">Nothing in progress.</div>`;

  $("feed").innerHTML = s.feed.map(e => `<div class="ev"><div class="t">${clock(e.ts)} · ${usd(e.spent_usd)}</div>` +
    (e.kind === "tool" ? `<div><span class="tool">${esc(e.name)}</span> <span class="detail">${esc(e.detail)}</span></div>`
                       : `<div class="text">${esc(e.detail)}</div>`) + `</div>`).join("") || `<div class="empty">No agent activity recorded.</div>`;

  $("hyps").innerHTML = s.hypotheses.slice().reverse().map(h => `<div class="hyp"><div><b>${esc(h.hypothesis)}</b></div>` +
    (h.layer ? `<div class="muted">layer: ${esc(h.layer)}</div>` : "") +
    h.measurements.map(m => { const x = m.expect || {};
      return `<div class="m"><span class="mono">${esc(m.tool)}</span> ${esc(x.metric)}: expected ${sig(x.value)} ${esc(x.unit)}, ` +
        `measured ${sig(m.actual)}, gap <b>${sig(m.gap)}</b>` +
        (m.reflection ? `<div class="muted">${esc(m.reflection)}</div>` : `<div class="warn">not reflected yet</div>`) + `</div>`; }).join("") +
    `</div>`).join("") || `<div class="empty">No hypotheses in this run.</div>`;

  const cell = m => {
    if (m.reason) return `<span class="muted">${esc(m.reason)}</span>`;
    if (m.metrics) return Object.entries(m.metrics).map(([k, v]) => v && typeof v === "object" && "value" in v
      ? `${esc(k)} <b>${sig(v.value)}</b>${v.valid === false ? ` <span class="bad">invalid</span>` : ""}` : `${esc(k)} ${esc(JSON.stringify(v))}`).join("<br>");
    if (m.kind === "equiv") return `tier ${esc(m.tier)} · score ratio <b>${sig(m.score_ratio)}</b> · n ${num(m.n, 0)}`;
    if (m.kind === "test") return `lint ${m.lint ? "pass" : "fail"} · tests ${m.tests ? "pass" : "fail"}`;
    return "";
  };
  $("meas").innerHTML = s.measurements.length ? `<table><tr><th>time</th><th>tool</th><th>verdict</th><th>result</th><th>wall</th><th>cost</th></tr>` +
    s.measurements.map(m => `<tr><td>${esc(new Date(m.at).toLocaleString())}</td><td>${esc(m.tool || m.kind)}</td>` +
      `<td class="${verdictClass(m.verdict)}">${esc(m.verdict || "")}</td><td>${cell(m)}</td><td>${dur(m.seconds)}</td><td>${usd(m.usd)}</td></tr>`).join("") + `</table>`
    : `<div class="empty">No measurements in this run.</div>`;
}

async function tick() {
  try {
    const r = await fetch("/state" + (run ? "?run=" + encodeURIComponent(run) : ""));
    render(await r.json());
  } catch (e) { $("updated").textContent = "dashboard server unreachable"; }
}
$("run").addEventListener("change", e => { run = e.target.value; history.replaceState(null, "", "?run=" + encodeURIComponent(run)); tick(); });
tick();
setInterval(tick, 2000);
</script>
</body>
</html>
